# Buduje obraz Dockera (amd64 + arm64) i publikuje go w GitHub Container Registry:
#   ghcr.io/pozdromaciek/game-lib-sh
# - tag v1.2.3 / v1.0.0-beta.1 → obraz z tą wersją + „latest”
# - push do main → obraz „main” (wersja rozwojowa); zmiany tylko w docs/, tools/ i *.md są pomijane
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # zmiany tylko w stronie projektu / dokumentacji nie budują obrazu (tagi budują zawsze)
    paths-ignore:
      - "docs/**"
      - "tools/**"
      - "**.md"
      - ".github/FUNDING.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
